name: Schulplan
options:
  bundleIdPrefix: de.ftrapp
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Schulplan:
    type: application
    platform: iOS
    sources: [Schulplan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ftrapp.schulplan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Schulplan
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  SchulplanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SchulplanTests]
    dependencies:
      - target: Schulplan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Schulplan:
    build:
      targets:
        Schulplan: all
        SchulplanTests: [test]
    test:
      targets: [SchulplanTests]
